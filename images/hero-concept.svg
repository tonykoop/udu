<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgU" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FAF1DA"/>
      <stop offset="100%" stop-color="#C9A876"/>
    </radialGradient>
    <radialGradient id="bodyU" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D4906B"/>
      <stop offset="40%" stop-color="#9B5A36"/>
      <stop offset="100%" stop-color="#3D1F0E"/>
    </radialGradient>
    <radialGradient id="holeU" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F0F06"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="url(#bgU)"/>

  <!-- Body shadow -->
  <ellipse cx="500" cy="640" rx="240" ry="35" fill="#5A3A1B" opacity="0.4"/>

  <!-- Udu body — egg/pot shape -->
  <path d="M 360 640
           C 280 640, 270 510, 295 410
           C 312 350, 350 230, 410 195
           L 590 195
           C 650 230, 688 350, 705 410
           C 730 510, 720 640, 640 640 Z"
        fill="url(#bodyU)" stroke="#2A140A" stroke-width="2"/>

  <!-- Mouth opening (top) -->
  <ellipse cx="500" cy="195" rx="90" ry="14" fill="url(#holeU)"/>
  <ellipse cx="500" cy="190" rx="90" ry="10" fill="#3D1F0E" opacity="0.9"/>

  <!-- Side hole (left) -->
  <ellipse cx="295" cy="430" rx="14" ry="38" fill="url(#holeU)"/>

  <!-- Glaze highlights — earth-red satin -->
  <ellipse cx="430" cy="280" rx="120" ry="50" fill="white" opacity="0.18"/>
  <ellipse cx="600" cy="380" rx="100" ry="40" fill="white" opacity="0.10"/>
  <ellipse cx="450" cy="500" rx="80" ry="25" fill="#FFE0B5" opacity="0.15"/>

  <!-- Caption -->
  <rect x="0" y="652" width="1000" height="48" fill="#2A140A" opacity="0.92"/>
  <text x="20" y="675" fill="#FFE7BA" font-size="14" font-weight="bold">AI-GENERATED CONCEPT — Slip-Cast Ceramic Udu Drum, Medium body (UDU-M, ~10 × 12 in)</text>
  <text x="20" y="691" fill="#E0CFA0" font-size="11">Manufacturing dimensions come from udu-design-table.xlsx and the SVG drawings, NOT from this image. Replace with photo after first UDU-P2 fire.</text>
</svg>
