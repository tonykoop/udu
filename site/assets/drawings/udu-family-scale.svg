<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="white" stroke="#222" stroke-width="1"/>
  <rect x="0" y="0" width="900" height="36" fill="#1F3A68"/>
  <text x="12" y="24" fill="white" font-size="16" font-weight="bold">Udu Family Scale Comparison — S / M / L / XL (front view, fired)</text>
  <text x="888" y="24" fill="white" font-size="10" text-anchor="end">UDU-DRW-003 | REV-A | 2026-05-02 | Units: inches | Scale 1:6</text>

  <!-- Common ground line -->
  <line x1="40" y1="510" x2="860" y2="510" stroke="#888" stroke-width="0.7"/>

  <!-- SMALL — 8 in dia, 10 in tall  → svg height ~ 100px @ 1:6 scale (10/72 of viewBox proportional) -->
  <g transform="translate(110,0)">
    <path d="M -50 510 C -65 510, -68 460, -55 425 C -45 400, -30 365, -5 350 L 35 350 C 60 365, 75 400, 85 425 C 98 460, 95 510, 80 510 Z"
          fill="#FFE7BA" stroke="#3D2810" stroke-width="1.5"/>
    <line x1="-15" y1="350" x2="45" y2="350" stroke="#C0392B" stroke-width="2"/>
    <ellipse cx="-50" cy="430" rx="2.5" ry="9" fill="#C0392B"/>
    <text x="15" y="540" font-size="11" font-weight="bold" text-anchor="middle">SMALL (S)</text>
    <text x="15" y="555" font-size="10" text-anchor="middle">8 × 10 in</text>
    <text x="15" y="570" font-size="9" text-anchor="middle" fill="#445577">~235 in³</text>
    <text x="15" y="583" font-size="9" text-anchor="middle" fill="#1F3A68">D♯4 / A3</text>
  </g>

  <!-- MEDIUM — 10 in dia, 12 in tall -->
  <g transform="translate(310,0)">
    <path d="M -65 510 C -82 510, -85 450, -70 410 C -58 380, -40 335, -10 318 L 50 318 C 80 335, 98 380, 110 410 C 125 450, 122 510, 105 510 Z"
          fill="#FFE0A8" stroke="#3D2810" stroke-width="1.5"/>
    <line x1="-22" y1="318" x2="62" y2="318" stroke="#C0392B" stroke-width="2"/>
    <ellipse cx="-65" cy="408" rx="3" ry="11" fill="#C0392B"/>
    <text x="20" y="540" font-size="11" font-weight="bold" text-anchor="middle">MEDIUM (M)</text>
    <text x="20" y="555" font-size="10" text-anchor="middle">10 × 12 in  •  *prototype 1*</text>
    <text x="20" y="570" font-size="9" text-anchor="middle" fill="#445577">~440 in³</text>
    <text x="20" y="583" font-size="9" text-anchor="middle" fill="#1F3A68">B3 / G3</text>
  </g>

  <!-- LARGE — 12 in dia, 14 in tall -->
  <g transform="translate(530,0)">
    <path d="M -78 510 C -98 510, -102 442, -85 396 C -70 360, -48 305, -15 282 L 65 282 C 98 305, 120 360, 135 396 C 152 442, 148 510, 128 510 Z"
          fill="#FCD89E" stroke="#3D2810" stroke-width="1.5"/>
    <line x1="-30" y1="282" x2="80" y2="282" stroke="#C0392B" stroke-width="2"/>
    <ellipse cx="-78" cy="392" rx="3.5" ry="13" fill="#C0392B"/>
    <text x="25" y="540" font-size="11" font-weight="bold" text-anchor="middle">LARGE (L)</text>
    <text x="25" y="555" font-size="10" text-anchor="middle">12 × 14 in</text>
    <text x="25" y="570" font-size="9" text-anchor="middle" fill="#445577">~739 in³</text>
    <text x="25" y="583" font-size="9" text-anchor="middle" fill="#1F3A68">G♯3 / D3</text>
  </g>

  <!-- XL — 14 in dia, 16 in tall -->
  <g transform="translate(770,0)">
    <path d="M -90 510 C -114 510, -118 432, -100 380 C -82 340, -55 280, -20 250 L 80 250 C 115 280, 142 340, 160 380 C 178 432, 174 510, 150 510 Z"
          fill="#F2C379" stroke="#3D2810" stroke-width="1.5"/>
    <line x1="-38" y1="250" x2="98" y2="250" stroke="#C0392B" stroke-width="2"/>
    <ellipse cx="-90" cy="378" rx="4" ry="14" fill="#C0392B"/>
    <text x="30" y="540" font-size="11" font-weight="bold" text-anchor="middle">XL</text>
    <text x="30" y="555" font-size="10" text-anchor="middle">14 × 16 in</text>
    <text x="30" y="570" font-size="9" text-anchor="middle" fill="#445577">~1149 in³</text>
    <text x="30" y="583" font-size="9" text-anchor="middle" fill="#1F3A68">F3 / C3</text>
  </g>

  <!-- Pitch axis annotation -->
  <text x="450" y="60" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F3A68">Mouth tone (red top opening) and side tone (red side ellipse) shown for each family member.</text>
  <text x="450" y="80" font-size="11" text-anchor="middle" fill="#445577">Body volume scales as D²·H·shape_factor; bass tones drop ~3-4 semitones per size step.</text>
</svg>
