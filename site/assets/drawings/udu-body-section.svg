<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="600" fill="white" stroke="#222" stroke-width="1"/>
  <rect x="0" y="0" width="800" height="36" fill="#1F3A68"/>
  <text x="12" y="24" fill="white" font-size="16" font-weight="bold">Udu Drum (Medium) — Body Cross-Section</text>
  <text x="788" y="24" fill="white" font-size="10" text-anchor="end">UDU-DRW-001 | REV-A | 2026-05-02 | Units: inches | Scale 1:2</text>

  <!-- Outer body profile (egg/pot) -->
  <path d="M 280 530
           C 200 530, 180 380, 220 280
           C 240 200, 280 130, 350 110
           L 450 110
           C 520 130, 560 200, 580 280
           C 620 380, 600 530, 520 530
           Z"
        fill="#FCFBF6" stroke="#222" stroke-width="2"/>

  <!-- Inner chamber profile -->
  <path d="M 308 510
           C 240 510, 220 380, 252 295
           C 270 220, 305 155, 365 138
           L 435 138
           C 495 155, 530 220, 548 295
           C 580 380, 560 510, 492 510
           Z"
        fill="#F1F4FA" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Mouth opening (top) -->
  <line x1="370" y1="110" x2="430" y2="110" stroke="#C0392B" stroke-width="2.5"/>
  <line x1="370" y1="138" x2="430" y2="138" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="100" font-size="11" fill="#C0392B" font-weight="bold" text-anchor="middle">MOUTH PORT — Ø 3.0 in (FIRED)</text>
  <text x="400" y="160" font-size="9" fill="#C0392B" text-anchor="middle">f_top = c/(2π)·√(A_top/(V·L_top)) ≈ B3 (247 Hz)</text>

  <!-- Side hole (left) -->
  <ellipse cx="217" cy="350" rx="6" ry="22" fill="#C0392B"/>
  <text x="190" y="345" font-size="11" fill="#C0392B" font-weight="bold" text-anchor="end">SIDE HOLE</text>
  <text x="190" y="358" font-size="10" fill="#C0392B" text-anchor="end">Ø 2.0 in (FIRED)</text>
  <text x="190" y="372" font-size="9" fill="#C0392B" text-anchor="end">≈ G3 (196 Hz)</text>

  <!-- Wall thickness callout -->
  <line x1="280" y1="430" x2="308" y2="430" stroke="#222" stroke-width="1"/>
  <line x1="280" y1="425" x2="280" y2="435" stroke="#222"/>
  <line x1="308" y1="425" x2="308" y2="435" stroke="#222"/>
  <text x="294" y="450" font-size="10" text-anchor="middle">0.30 in (7.6 mm) wall</text>

  <!-- Body diameter callout -->
  <line x1="180" y1="555" x2="620" y2="555" stroke="#222" stroke-width="1"/>
  <line x1="180" y1="550" x2="180" y2="560" stroke="#222"/>
  <line x1="620" y1="550" x2="620" y2="560" stroke="#222"/>
  <text x="400" y="572" font-size="11" text-anchor="middle">body_dia = 10.0 in (FIRED)  → master = 11.36 in</text>

  <!-- Body height callout -->
  <line x1="650" y1="110" x2="650" y2="530" stroke="#222" stroke-width="1"/>
  <line x1="645" y1="110" x2="655" y2="110" stroke="#222"/>
  <line x1="645" y1="530" x2="655" y2="530" stroke="#222"/>
  <text x="668" y="320" font-size="11" text-anchor="middle" transform="rotate(-90 668 320)">body_height = 12.0 in (FIRED)</text>

  <!-- Volume callout -->
  <text x="400" y="320" font-size="13" text-anchor="middle" fill="#1F3A68" font-weight="bold">V_chamber ≈ 440 in³</text>
  <text x="400" y="338" font-size="10" text-anchor="middle" fill="#445577" font-style="italic">= (π/6) · D² · H · shape_factor (0.7)</text>

  <!-- Centerline -->
  <line x1="400" y1="100" x2="400" y2="540" stroke="#888" stroke-width="0.7" stroke-dasharray="6 3 1 3"/>
  <text x="408" y="530" font-size="9" fill="#888">CL</text>

  <!-- Notes block -->
  <rect x="20" y="585" width="760" height="12" fill="none"/>
</svg>
